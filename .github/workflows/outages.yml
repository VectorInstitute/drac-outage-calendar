name: Build outage calendar
on:
  schedule:
    - cron: "0 */6 * * *"    # every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
  workflow_dispatch:          # lets you run it manually
permissions:
  contents: write          # to commit accumulated state back to calendar-state
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # main: the code
      - uses: actions/checkout@v4          # accumulated state (orphan branch)
        with:
          ref: calendar-state
          path: state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build feeds (one scrape, carrying forward elapsed events)
        run: |
          python build_feeds.py --out-dir public --state-dir state
      - name: Persist updated state to calendar-state
        run: |
          cp public/outages.ics public/outages-planned-only.ics \
             public/killarney.ics public/killarney-planned-only.ics state/
          cd state
          if git diff --quiet; then
            echo "State unchanged; nothing to commit."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add outages.ics outages-planned-only.ics \
                    killarney.ics killarney-planned-only.ics
            git commit -m "Update calendar state ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
