name: Build outage calendar
on:
  schedule:
    - cron: "0 * * * *"      # hourly (on the hour, UTC)
  workflow_dispatch:          # lets you run it manually
permissions:
  contents: write          # to commit accumulated state back to calendar-state
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # main: the code
      - uses: actions/checkout@v4          # accumulated state (orphan branch)
        with:
          ref: calendar-state
          path: state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build feeds (one scrape + catch-up gap scan)
        run: |
          # The shared gap scan walks incident ids skipped between runs, so the
          # feed keeps accumulating sub-day outages -- the same coverage a full
          # backfill would give, built up over time. State lives in calendar-state.
          python build_feeds.py --out-dir public --state-dir state \
            --scan-state state/scan-state.txt
      - name: Persist updated state to calendar-state
        run: |
          cp public/*.ics state/          # updated feeds
          cd state
          git add -A                      # feeds + gap-scan high-water (scan-state.txt)
          if git diff --cached --quiet; then
            echo "State unchanged; nothing to commit."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update calendar state ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
